<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- QALAM · the pen-to-tree mark: the tree grows out of what the pen inscribes -->
  <defs>
    <radialGradient id="qglow" cx="50%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1B4332" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- obsidian badge, gold ring, emerald glow -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0B0F0E" stroke="#C9A227" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#qglow)"/>

  <!-- the pen nib, tip in the ink -->
  <path d="M32 40 C27.5 44.5 27.5 48.5 32 53 C36.5 48.5 36.5 44.5 32 40 Z" fill="#16201D" stroke="#C9A227" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="32" cy="43.2" r="1.3" fill="#E4C25C"/>
  <path d="M32 45.6 L32 49.4" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>

  <!-- trunk and branches in gold -->
  <g fill="none" stroke="#C9A227" stroke-linecap="round">
    <path d="M32 40 C32 36 30.6 32.6 31.4 28.6" stroke-width="2.6"/>
    <path d="M31.6 31.2 C27.6 28.8 24.2 27.2 20.6 24.4" stroke-width="1.9"/>
    <path d="M31.9 30.2 C35.9 27.8 39.3 26.2 42.9 23.4" stroke-width="1.9"/>
    <path d="M31.4 28.6 C31 25.2 31.4 22.2 32.2 18.8" stroke-width="1.9"/>
    <path d="M20.6 24.4 C19.3 22.4 18.2 20.9 17 19.6" stroke-width="1.2"/>
    <path d="M42.9 23.4 C44.2 21.4 45.3 19.9 46.6 18.6" stroke-width="1.2"/>
  </g>

  <!-- the canopy: emerald subjects, one gold page, one live petal -->
  <g>
    <circle cx="17"   cy="19.2" r="2.6" fill="#1B4332"/>
    <circle cx="21.5" cy="16.8" r="2.2" fill="#2D6A4F"/>
    <circle cx="26.5" cy="15.2" r="2.7" fill="#14532D"/>
    <circle cx="32"   cy="14.2" r="2.4" fill="#1B4332"/>
    <circle cx="37.5" cy="15.2" r="2.7" fill="#2D6A4F"/>
    <circle cx="42.5" cy="16.8" r="2.2" fill="#14532D"/>
    <circle cx="47"   cy="19.2" r="2.6" fill="#1B4332"/>
    <circle cx="28"   cy="19.6" r="2"   fill="#2D6A4F"/>
    <circle cx="36"   cy="19.6" r="2"   fill="#1B4332"/>
    <circle cx="32"   cy="19.2" r="2.3" fill="#E4C25C"/>
    <circle cx="23.5" cy="20.6" r="1.9" fill="#F0A6C8"/>
  </g>
</svg>
